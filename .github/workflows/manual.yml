name: Trigger PHP Script on InfinityFree

on:
  schedule:
    - cron: '0 10 * * *' # Runs daily at 10:00 AM
  workflow_dispatch: # Allows manual triggering

jobs:
  trigger-script:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger PHP script on InfinityFree
        run: curl -k -X GET https://yourdomain.infinityfree.net/actualizar.php
