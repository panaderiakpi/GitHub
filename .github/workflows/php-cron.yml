name: Actualizar BTF

on:
  schedule:
    - cron: '0 10 * * *' # Se ejecuta a las 10:00 AM cada día
      workflow_dispatch:  # Permitir la ejecución manual

jobs:
  ejecutar-php-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4' # Versión de PHP que estás usando
        tools: composer

    - name: Install PHP dependencies
      run: composer require guzzlehttp/guzzle

    - name: Run PHP script
      run: php actualizar.php
