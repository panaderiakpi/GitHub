name: Ejecutar Script PHP Diario

# Se ejecuta automáticamente todos los días a las 00:10 (hora de Europa/Madrid)
on:
  schedule:
    - cron: '15 22 * * *'  # Ejecutar diariamente a las 22:10 UTC (que son las 00:10 en Europa/Madrid)
  workflow_dispatch:  # Permite ejecutar manualmente el workflow

jobs:
  run-php-script:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3  # Descargar el código del repositorio

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'  # Ajustar la versión de PHP según lo necesites
        tools: composer

    - name: Run PHP script
      run: php actualizar.php  # Ejecutar el script PHP actualizar.php

    - name: Commit and push results
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add resultado.txt  # Asegúrate de que estos archivos existan
        git commit -m "Actualizar resultado"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Usar el token de GitHub para hacer el push
