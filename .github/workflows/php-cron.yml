name: Ejecutar Script PHP Diario

on:
  schedule:
    - cron: '0 0 * * *'  # Ejecutar diariamente a medianoche
  workflow_dispatch:  # Permite ejecutar manualmente el workflow

jobs:
  run-php-script:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3  # Asegurarse de usar la última versión compatible

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'  # Puedes ajustar la versión de PHP según tu necesidad

    - name: Run PHP script
      run: php actualizar.php

    - name: Commit and push results
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add resultado.txt Btf.m3u
        git commit -m "Actualizar resultado y Btf.m3u"
        git push
