name: Ejecutar Script PHP Diario

on:
  schedule:
    - cron: '0 0 * * *'  # Ejecutar diariamente a medianoche
  workflow_dispatch:  # Permite ejecutar manualmente el workflow

jobs:
  run-php-script:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3  # Descargar el código del repositorio

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'  # Ajustar la versión de PHP

    - name: Run PHP script
      run: php actualizar.php  # Ejecutar el script PHP que genera los archivos

    - name: Configure git for commit
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Pull latest changes from GitHub
      run: |
        git pull origin main  # Sincronizar con los últimos cambios del repositorio remoto

    - name: Commit and push results
      run: |
        git add resultado.txt Btf.m3u  # Añadir los archivos modificados
        git commit -m "Actualizar resultado y Btf.m3u" || echo "No hay cambios para commitear"  # Solo hacer commit si hay cambios
        git push origin main  # Hacer push de los cambios al repositorio remoto
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Usar el token de GitHub Actions para autenticación
