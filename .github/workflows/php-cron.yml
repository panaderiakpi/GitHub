name: Actualizar M3U y Subir a Dropbox

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  actualizar_m3u:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v2

      # Paso 2: Configurar PHP (si necesitas PHP 8, puedes cambiar la versión aquí)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'  # Cambia la versión de PHP según tus necesidades

      # Paso 3: Ejecutar el script PHP para generar los archivos .m3u
      - name: Ejecutar script PHP
        run: php actualizar.php

      # Paso 4: Configurar el usuario y correo de Git para los commits
      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # Paso 5: Añadir los archivos modificados (Movistar_base.m3u) y no rastreados (gitbtf.m3u) al área de staging
      - name: Añadir archivos modificados y nuevos
        run: |
          git add Movistar_base.m3u gitbtf.m3u

      # Paso 6: Comprobar si hay cambios para commit
      - name: Verificar si hay cambios
        run: |
          if git diff --cached --quiet; then
            echo "No hay cambios para hacer commit."
            exit 0
          fi

      # Paso 7: Hacer commit de los cambios si hay modificaciones
      - name: Commit de los cambios
        run: |
          git commit -m "Actualización de archivos .m3u desde el script PHP"

      # Paso 8: Hacer push de los cambios al repositorio
      - name: Push cambios al repositorio
        run: git push

