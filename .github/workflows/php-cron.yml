name: Ejecutar Script PHP Diario

# Se ejecuta a las 08:40 (hora de Europa/Madrid)
on:
  schedule:
    - cron: '40 6 * * *'  # 06:40 UTC es 08:40 en Europa/Madrid
    - cron: '30 9 * * *'  # 09:30 UTC es 11:30 en Europa/Madrid
  workflow_dispatch:  # Permite ejecutar manualmente el workflow

jobs:
  run-php-script:
    runs-on: ubuntu-latest
    
steps:
  - name: Checkout repository
    uses: actions/checkout@v2

  # Ejecutar tu script PHP
  - name: Run your PHP script
    run: php actualizar.php

  # Configurar Git
  - name: Set GitHub Actions user name and email
    run: |
      git config --global user.name "GitHub Actions"
      git config --global user.email "actions@github.com"

  # Agregar todos los archivos modificados y no rastreados
  - name: Add modified and untracked files to Git
    run: |
      git add Movistar_base.m3u gitbtf.m3u

  # Hacer commit de los cambios
  - name: Commit changes
    run: |
      git commit -m "Actualización de archivos .m3u desde el script PHP"

  # Hacer push de los cambios
  - name: Push changes to repository
    run: |
      git push
