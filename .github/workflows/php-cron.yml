name: Ejecutar Script PHP Diario

# Programar la ejecución diaria a las 22:00 UTC
on:
  schedule:
    - cron: '0 22 * * *'  # Ejecutar diariamente a las 22:00 UTC
  workflow_dispatch:  # Permitir la ejecución manual

jobs:
  ejecutar-php-script:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # Paso 2: Configurar PHP
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'  # Cambiar la versión si es necesario
          tools: composer

      # Paso 3: Ejecutar el script PHP "actualizar.php"
      - name: Ejecutar el script PHP
        run: php actualizar.php  # Asegúrate de que el script esté en la ruta adecuada
